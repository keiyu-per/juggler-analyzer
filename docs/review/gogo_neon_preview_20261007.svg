  <text x="164" y="299" fill="#fff" text-anchor="middle" font-size="24" font-family="sans-serif" font-weight="800">マイVI</text>
  <text x="386" y="299" fill="#fff" text-anchor="middle" font-size="24" font-family="sans-serif" font-weight="800">マイV</text>
