<g transform="translate(70 540)">
  <text x="0" y="0" fill="#64e88e" font-size="24" font-family="sans-serif" font-weight="800">採用ポイント</text>
  <text x="0" y="38" fill="#d8dee8" font-size="20" font-family="sans-serif">• 青の白飛びを抑え、シアン → 濃青のコントラストを強化</text>
  <text x="0" y="72" fill="#d8dee8" font-size="20" font-family="sans-serif">• GOGO! はネオンピンクの芯色を残し、外周グローで発光</text>
