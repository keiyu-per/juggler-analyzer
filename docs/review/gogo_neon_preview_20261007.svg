  <text x="28" y="44" fill="#9aa4b5" font-size="20" font-family="sans-serif" font-weight="700">承認ランプ単体</text>
  <g transform="translate(90 78)">
    <polygon points="140,0 162,35 205,12 202,55 260,38 226,88 280,108 226,132 264,177 202,162 204,212 162,183 140,220 117,183 76,212 77,162 16,177 54,132 0,108 54,88 18,38 78,55 76,12 117,35"
      fill="url(#blueGlow)" filter="url(#glowBlue)"/>
    <g transform="translate(140 88) rotate(-8)" filter="url(#glowPink)">
      <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" fill="#ff4fe7" stroke="#ffd9fb" stroke-width="1.4"
        font-size="56" font-family="sans-serif" font-style="italic" font-weight="900">GOGO!</text>
    </g>
    <g transform="translate(140 186)" filter="url(#glowOrange)">
