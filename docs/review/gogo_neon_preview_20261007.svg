<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs>
  <radialGradient id="blueGlow" cx="50%" cy="48%" r="58%">
    <stop offset="0%" stop-color="#9ff8ff"/>
    <stop offset="14%" stop-color="#39d7ff"/>
    <stop offset="34%" stop-color="#0c7dff"/>
    <stop offset="60%" stop-color="#1146d8"/>
    <stop offset="100%" stop-color="#060d32"/>
  </radialGradient>
  <filter id="glowBlue" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="12" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowPink" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="8" result="p"/>
    <feMerge><feMergeNode in="p"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowOrange" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="7" result="o"/>
    <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="760" fill="#0b0f15"/>
<text x="48" y="58" fill="#f4f7fb" font-size="32" font-family="sans-serif" font-weight="700">GOGOランプ 承認プレビュー</text>
<text x="48" y="92" fill="#8f98a8" font-size="19" font-family="sans-serif">CR-2026-017 / 2026-10-07 / 採用基準：高彩度ネオン、パステル感を抑制</text>

<g transform="translate(70 140)">
